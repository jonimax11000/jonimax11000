name: Generate Snake Animation

on:
  # Ejecutar automáticamente cada 24 horas
  schedule:
    - cron: "0 0 * * *"
  
  # Permitir ejecución manual
  workflow_dispatch:
  
  # Ejecutar en cada push a la rama principal
  push:
    branches:
    - main
    - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generar la animación en formato SVG
      - name: Generar github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Subir los archivos generados a la rama "output"
      - name: Push a la rama output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
